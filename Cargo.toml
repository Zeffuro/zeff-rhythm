[package]
name = "zeff-rhythm"
version = "0.1.0"
edition = "2024"
default-run = "zeff-rhythm"

[[bin]]
name = "zeff-rhythm"
path = "src/main.rs"

[[bin]]
name = "zeff-rhythm-app"
path = "src/gui.rs"
test = false

[workspace]
members = ["crates/rhythm-core"]
resolver = "3"

[dependencies]
cpal = "0.18.1"
cosmic-text = "0.19"
crossterm = "0.29.0"
fastrand = "2.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
pollster = "0.4.0"
rhythm-core = { path = "crates/rhythm-core" }
sdl3 = { version = "0.18.4", features = ["build-from-source-static"] }
serde = { version = "1.0", features = ["derive"] }
symphonia = { version = "0.6.0", default-features = false, features = ["mpa", "ogg", "pcm", "vorbis", "wav"] }
toml = "0.9"
unicode-segmentation = "1.12"
wgpu = "30.0.0"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
