[package]
name = "zeff-rhythm"
version = "0.1.0"
edition = "2024"
default-run = "zeff-rhythm"

[[bin]]
name = "zeff-rhythm"
path = "src/main.rs"

[workspace]
members = ["crates/rhythm-core"]
resolver = "3"

[dependencies]
cpal = "0.18.1"
crossterm = "0.29.0"
pollster = "0.4.0"
rhythm-core = { path = "crates/rhythm-core" }
sdl3 = { version = "0.18.4", features = ["build-from-source-static"] }
serde = { version = "1.0", features = ["derive"] }
symphonia = { version = "0.6.0", default-features = false, features = ["mpa", "ogg", "pcm", "vorbis", "wav"] }
toml = "0.9"
wgpu = "30.0.0"
winit = "0.30.13"
